id: nrsc5_l1_am_encoder_ma3
label: 'Layer 1 AM encoder: MA3'
category: '[NRSC-5]'

parameters:
-   id: rdb
    label: Reduced digital bandwidth
    dtype: int
    default: '0'
    options: ['0', '1']
    option_labels: ['No', 'Yes']
-   id: hpp
    label: High-power PIDS
    dtype: int
    default: '0'
    options: ['0', '1']
    option_labels: ['No', 'Yes']
    hide: ${'all' if rdb else 'none'}

inputs:
-   label: pids
    domain: stream
    dtype: byte
    vlen: 80
-   label: p1
    domain: stream
    dtype: byte
    vlen: 3750
-   label: p3
    domain: stream
    dtype: byte
    vlen: 30000
    hide: ${rdb}

outputs:
-   domain: stream
    dtype: complex
    vlen: 256
-   domain: message
    id: clock
    optional: true

templates:
  imports: import nrsc5
  make: nrsc5.l1_am_encoder(3, rdb=${rdb}, hpp=${hpp})

file_format: 1
